# BL-DEP-R1: deployment requires explicit remote configuration; no local fallback.
server.address=0.0.0.0
server.port=${PORT:10000}
server.forward-headers-strategy=native
server.shutdown=graceful
spring.lifecycle.timeout-per-shutdown-phase=20s
spring.datasource.url=${PROCUREFLOW_DB_URL}
spring.datasource.username=${PROCUREFLOW_DB_USERNAME}
spring.datasource.password=${PROCUREFLOW_DB_PASSWORD}
spring.datasource.hikari.maximum-pool-size=3
spring.datasource.hikari.minimum-idle=0
spring.datasource.hikari.connection-timeout=10000
spring.datasource.hikari.idle-timeout=30000
spring.datasource.hikari.max-lifetime=600000
spring.datasource.hikari.keepalive-time=0
spring.datasource.hikari.data-source-properties.sslmode=verify-full
spring.datasource.hikari.data-source-properties.sslfactory=org.postgresql.ssl.DefaultJavaSSLFactory
spring.datasource.hikari.data-source-properties.connectTimeout=10
spring.datasource.hikari.data-source-properties.socketTimeout=60
spring.flyway.clean-disabled=true
spring.jpa.hibernate.ddl-auto=validate
server.servlet.session.cookie.secure=true
spring.mail.host=${PROCUREFLOW_SMTP_HOST}
spring.mail.port=${PROCUREFLOW_SMTP_PORT:2525}
spring.mail.username=${PROCUREFLOW_SMTP_USERNAME}
spring.mail.password=${PROCUREFLOW_SMTP_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.ssl.checkserveridentity=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=10000
spring.mail.properties.mail.smtp.writetimeout=10000
