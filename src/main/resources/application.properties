spring.application.name=ProcureFlow
spring.datasource.url=jdbc:postgresql://localhost:5332/ProcureFlow
spring.datasource.username=ProcureFlow
spring.datasource.password=password
spring.flyway.enabled=true
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.show-sql=false
server.servlet.session.timeout=30m
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.secure=${PROCUREFLOW_COOKIE_SECURE:true}
server.servlet.session.cookie.same-site=lax
spring.mail.host=${PROCUREFLOW_SMTP_HOST:}
spring.mail.port=${PROCUREFLOW_SMTP_PORT:587}
spring.mail.username=${PROCUREFLOW_SMTP_USERNAME:}
spring.mail.password=${PROCUREFLOW_SMTP_PASSWORD:}
spring.mail.properties.mail.smtp.auth=${PROCUREFLOW_SMTP_AUTH:true}
spring.mail.properties.mail.smtp.starttls.enable=${PROCUREFLOW_SMTP_STARTTLS:true}
